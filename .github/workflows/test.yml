name: Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'translaas/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'translaas/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # cache: 'pip' - Will be enabled once pyproject.toml is created

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build packages
        run: python -m build

      - name: Run unit tests
        run: pytest --cov=translaas --cov-report=xml --cov-report=term || test $? -eq 5
        # Allow exit code 5 (no tests collected) to pass during initial setup

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-tests
