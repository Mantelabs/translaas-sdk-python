name: CI

# Default: Ubuntu only (push/PR) to limit Actions spend across SDK repos.
# Windows + macOS smoke: run manually — Actions → CI → Run workflow.
on:
  push:
    branches:
      - main
      - develop
    paths: &ci-paths
      - '.github/workflows/ci.yml'
      - 'translaas/**/*.py'
      - 'tests/**/*.py'
      - 'Makefile'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
  pull_request:
    branches:
      - main
      - develop
    paths: *ci-paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configure:
    name: Configure matrix
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-matrix.outputs.python-versions }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'python-versions=["3.12"]' >> "$GITHUB_OUTPUT"
          else
            echo 'python-versions=["3.8","3.9","3.10","3.11","3.12"]' >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: python -m ruff check translaas/

      - name: Run type checking
        run: python -m mypy translaas/ --ignore-missing-imports --no-strict-optional

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build package
        run: python -m build

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs:
      - configure
      - lint-and-typecheck
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.configure.outputs.python-versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not live"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-tests

  # Windows: manual runs only (Actions → CI → Run workflow).
  smoke-windows-manual:
    name: Smoke — Windows (Python 3.10)
    if: github.event_name == 'workflow_dispatch'
    needs:
      - lint-and-typecheck
      - build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not live" --no-cov

  # macOS: manual runs only (Actions → CI → Run workflow).
  smoke-macos-manual:
    name: Smoke — macOS (Python 3.10)
    if: github.event_name == 'workflow_dispatch'
    needs:
      - lint-and-typecheck
      - build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not live" --no-cov
