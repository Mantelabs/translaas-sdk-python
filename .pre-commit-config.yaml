# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Formatting runs on commit (pre-commit stage)
# All validation runs on push (pre-push stage)

repos:
  # Ruff formatting - runs on commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff-format
        # ruff-format is black-compatible, so we use it instead of black
        stages: [commit]

  # Ruff linting - runs on push
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-push]

  # General file checks - runs on push
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-push]
      - id: end-of-file-fixer
        stages: [pre-push]
      - id: check-yaml
        stages: [pre-push]
      - id: check-toml
        stages: [pre-push]
      - id: check-json
        stages: [pre-push]
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [pre-push]
      - id: check-merge-conflict
        stages: [pre-push]
      - id: debug-statements
        stages: [pre-push]

  # Type checking with mypy - runs on push
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        # Removed types-all as it includes packages that don't exist (types-pkg-resources)
        # Add specific type stubs as needed: additional_dependencies: [types-httpx]
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^tests/
        stages: [pre-push]

  # Run tests before push
  # Note: Exit code 5 (no tests collected) is allowed to pass
  # This prevents blocking pushes during initial project setup when no tests exist yet
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Allow exit code 5 (no tests) to pass - works with Git Bash on Windows
        # Use venv Python if available, otherwise fall back to system Python
        entry: bash -c 'if [ -f "venv/Scripts/python.exe" ]; then venv/Scripts/python.exe -m pytest || test $? -eq 5; elif [ -f "venv/bin/python" ]; then venv/bin/python -m pytest || test $? -eq 5; else python -m pytest || test $? -eq 5; fi'
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        stages: [pre-push]
