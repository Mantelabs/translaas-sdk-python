# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Setup with pre-push: pre-commit install --hook-type pre-commit --hook-type pre-push
#
# For partial commits (e.g., committing only feature files, tests, or docs separately):
#   Option 1: Skip specific hooks: SKIP=ruff,ruff-format git commit -m "message"
#   Option 2: Skip all hooks: git commit --no-verify -m "message"
#
# Note: Hooks only run on staged files by default, but some checks may still fail
# if they require consistency across the entire codebase.

repos:
  # Ruff for linting and formatting (ruff-format is black-compatible)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix]
        # Removed --exit-non-zero-on-fix to allow partial commits
        # Files are still fixed, but won't fail if other files have issues
      - id: ruff-format
        # ruff-format is black-compatible, so we use it instead of black

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements

  # Type checking with mypy
  # NOTE: Disabled by default in pre-commit as it can be slow
  # Run manually: mypy translaas/
  # Or enable by removing 'stages: []' below
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        # Removed types-all as it includes packages that don't exist (types-pkg-resources)
        # Add specific type stubs as needed: additional_dependencies: [types-httpx]
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^tests/
        # Disabled in pre-commit - run manually or in CI for better performance
        stages: []

  # Run tests before push
  # Note: Exit code 5 (no tests collected) is allowed to pass
  # This prevents blocking pushes during initial project setup when no tests exist yet
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Allow exit code 5 (no tests) to pass - works with Git Bash on Windows
        # Use venv Python if available, otherwise fall back to system Python
        entry: bash -c 'if [ -f "venv/Scripts/python.exe" ]; then venv/Scripts/python.exe -m pytest || test $? -eq 5; elif [ -f "venv/bin/python" ]; then venv/bin/python -m pytest || test $? -eq 5; else python -m pytest || test $? -eq 5; fi'
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        stages: [pre-push]
